# =============================================================
#  İlan takip yapılandırması
#  Yeni site eklerken:  python inspect_site.py "<URL>"
# =============================================================

defaults:
  timeout: 30
  delay_between_sources: 3
  digest_threshold: 6         # bu kadar veya daha fazla yeni ilan varsa tek özet mesaj

notify_errors: true

sources:
  # ---------------------------------------------------------
  # 101evler — Lefkoşa satılık konut, 200m²+, seçili bölgeler
  # Filtreler URL'nin içinde (min_m2, property_subtype, district)
  # sort=li  → en yeni ilan başta
  # ---------------------------------------------------------
  - name: 101evler-lefkosa-satilik
    label: "101evler — Lefkoşa Satılık 200m²+"
    enabled: true
    url: "https://www.101evler.com/kibris/satilik-konut/lefkosa?min_m2=200&property_subtype=1,4&district=14,144,27&page=1&sort=li"
    base_url: "https://www.101evler.com"
    type: html
    render: false              # sayfa sunucu tarafında üretiliyor, JS gerekmiyor

    selectors:
      item: "div.ilanitembasic"
      title: "h4.text-block-129::text"
      price: "div.basicprice::text"                      # £ cinsinden
      link: "a.hover-black::attr(href)"
      location: "div.text-block-131::text"
      date: "div.text-block-132::text"
      id: "div.text-block-132 ~ div.text-block-132::text"  # #566700 — dedup anahtarı
      alan: "div.text-block-130::text"
      oda: "div.text-block-130 ~ div.text-block-130::text"
      emlakci: "div.div-block-334::text"

    # URL zaten filtreli olduğu için burada ek kural şart değil.
    # İhtiyaç olursa aç — fiyatlar STERLİN (£) cinsindendir:
    # filters:
    #   max_price: 500000
    #   min_price: 150000
    #   include: ["gönyeli", "yenikent"]
    #   exclude: ["proje", "maketten"]

    notify_on_first_run: false   # ilk tarama mevcut 30 ilanı sessizce kaydeder

  # ---------------------------------------------------------
  # hangiev.com — Lefkoşa (Gönyeli/Kanlıköy/Yenikent),
  # villa + müstakil ev, min 3 yatak odası, min 200m²
  # NOT: URL'de ikinci "?" yerine "&" olmalı, yoksa
  #      subtypes/minbedrooms/minarea filtreleri yok sayılır.
  # ---------------------------------------------------------
  - name: hangiev-lefkosa-satilik
    label: "hangiev — Lefkoşa Villa/Müstakil 200m²+"
    enabled: true
    url: "https://www.hangiev.com/lefkosa-satilik-evler?bolge=gonyeli,kanlikoy,yenikent&subtypes=villa%2Cmustakil-ev&minbedrooms=3&minarea=200"
    base_url: "https://www.hangiev.com"
    type: html
    render: false              # sunucu tarafında üretiliyor

    selectors:
      item: "div.list-item"
      title: "a.stretched-link::own_text"        # sadece <a>'nın kendi metni (konum hariç)
      price: "p.price::text"                     # £ cinsinden
      link: "a.stretched-link::attr(href)"
      location: "a.stretched-link span::text"
      id: "::attr(data-propertyid)"              # kartın kendi özniteliği — dedup anahtarı
      emlakci: "div.broker-name p::text"

    # filters:
    #   max_price: 500000     # sterlin
    #   exclude: ["proje", "maketten"]

    notify_on_first_run: false

  # ---------------------------------------------------------
  # metroevler.com — Lefkoşa (bölge 14/144/27), satılık,
  # konut tipi villa + müstakil, min 200m²
  # ---------------------------------------------------------
  - name: metroevler-lefkosa-satilik
    label: "metroevler — Lefkoşa Villa/Müstakil 200m²+"
    enabled: true
    url: "https://www.metroevler.com/satilik-emlak/lefkosa?district%5B0%5D=14&district%5B1%5D=144&district%5B2%5D=27&s-r=S&property_type=1&property_subtype%5B0%5D=1&property_subtype%5B1%5D=4&min_m2=200&page=1&sort=li"
    base_url: "https://www.metroevler.com"
    type: html
    render: false              # sunucu tarafında üretiliyor

    selectors:
      item: "div.listing-item"
      title: "div.listing-title h4 a::text"
      price: "span.listing-price-details::text"          # £ cinsinden
      link: "a.listing-img-container::attr(href)"         # /ilan-detay/564873 — dedup anahtarı
      location: "a.listing-address::text"
      date: "ul.listing-details li.pull-right span::text"
      tip: "ul.listing-details li:nth-child(1) span::text"
      alan: "ul.listing-details li:nth-child(2) span::text_tight"   # 315m<sup>2</sup> -> "315m2"
      oda: "ul.listing-details li:nth-child(3) span::text"

    # filters:
    #   max_price: 500000     # sterlin

    notify_on_first_run: false
